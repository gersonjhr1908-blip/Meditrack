quarkus.datasource.db-kind=mssql

quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=MediTrack;encrypt=true;trustServerCertificate=true
quarkus.datasource.username=${MEDITRACK_DB_USER}
quarkus.datasource.password=${MEDITRACK_DB_PASSWORD}

# Configuracion JWT
smallrye.jwt.sign.key.location=C:/meditrack/keys/privateKey.pem
mp.jwt.verify.publickey.location=C:/meditrack/keys/publicKey.pem
mp.jwt.verify.issuer=meditrack-api
smallrye.jwt.new-token.issuer=meditrack-api
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b host=%{i,Host} ct=%{i,Content-Type} cl=%{i,Content-Length} ua=%{i,User-Agent} ae=%{i,Accept-Encoding} conn=%{i,Connection}

# Duracion del token: 30 minutos
smallrye.jwt.new-token.lifespan=1800